plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.komprexo.app'
    compileSdk 36
    defaultConfig {
        // Proposed ID: final owner approval required before publication.
        applicationId 'com.komprexo.app'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '0.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        test.java.srcDir 'src/sharedTest/java'
        androidTest.java.srcDir 'src/sharedTest/java'
        androidTest.assets.srcDir 'src/test/assets'
    }
    buildFeatures { compose true; buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    kotlinOptions { jvmTarget = '17' }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    // Espresso 3.7 uses platform TestLooperManager APIs introduced in Android 16.
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
}

// Audit actual runtime artifacts and published POM metadata, not guessed licenses.
tasks.register('auditRuntimeDependencies') {
    doLast {
        def report = file(buildDir.toString() + '/reports/runtime-licenses')
        report.mkdirs()
        def entries = configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
            def id = artifact.moduleVersion.id
            def coordinate = id.group + ':' + id.name + ':' + id.version
            def pom = configurations.detachedConfiguration(project.dependencies.create(coordinate + '@pom')).resolve().first()
            def target = new File(report, id.group + '-' + id.name + '-' + id.version + '.pom')
            target.bytes = pom.bytes
            [coordinate: coordinate, pom: target.name, artifact: artifact.file.absolutePath]
        }.unique { it.coordinate }.sort { it.coordinate }
        new File(report, 'dependencies.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries))
    }
}
