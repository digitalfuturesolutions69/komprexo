name: Komprexo Android and static preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint, and assemble debug APK
        run: ./gradlew --no-daemon :app:compileDebugKotlin :app:compileDebugUnitTestKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:compileReleaseKotlin :app:auditRuntimeDependencies
      - name: Verify release Billing isolation and audited permissions/dependencies
        run: python3 scripts/check-phase4-security.py
      - uses: actions/upload-artifact@v4
        with:
          name: komprexo-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ github.sha }}
          path: app/build/reports/
  device-test:
    strategy:
      fail-fast: false
      matrix:
        api: [23, 26, 28, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          # API 36 AOSP Quickstep repeatedly ANRs over the app in captured screenshots.
          # Use the official Google APIs image; all tests and failure checks stay enabled.
          target: ${{ matrix.api == 36 && 'google_apis' || 'default' }}
          arch: x86_64
          profile: pixel_2
          # Official software renderer; Vulkan is disabled after verified color-buffer/frame stalls.
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: python3 scripts/configure-compact-emulator.py
          disable-animations: true
          script: |
            adb shell wm size
            adb shell wm size 720x1280
            adb shell wm density 360
            # Bounded runner preserves sanitized per-test diagnostics even after a stall.
            bash scripts/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api${{ matrix.api }}-${{ github.sha }}
          path: app/build/reports/androidTests/
  static-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build static source and validate assets/locales/legal/internal links
        run: |
          python3 scripts/generate-legal-assets.py
          python3 scripts/build-static-site.py
          python3 scripts/prepare-static-artifact.py
          python3 scripts/test-phase4-assets.py
      - name: Install browser test dependencies
        working-directory: website
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Responsive and accessible browser checks
        working-directory: website
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-preview-${{ github.sha }}
          path: |
            website/build/
            website/deployment/
            website/playwright-report/
            website/test-results/
          if-no-files-found: error
          retention-days: 14
